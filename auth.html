<!DOCTYPE html>
<html>
<head>
  <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
</head>
<body>
<script>
  const msalConfig = {
    auth: {
      clientId: "705cf97b-720b-4240-b6d0-02a6655300b2",
      authority: "https://login.microsoftonline.com/5904ae0b-47e9-4b06-843e-60769342a32b",
      redirectUri: "https://co-draft.keeploopd.com/auth.html"
    }
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  const loginRequest = {
    scopes: ["api://co-draft.keeploopd.com/705cf97b-720b-4240-b6d0-02a6655300b2/access_as_user"]
  };

  async function authenticate() {
    try {
      const result = await msalInstance.loginPopup(loginRequest);

      Office.context.ui.messageParent(JSON.stringify({
        accessToken: result.accessToken
      }));

    } catch (err) {
      console.error("MSAL error", {
        errorCode: err.errorCode,
        errorMessage: err.errorMessage,
        subError: err.subError,
        correlationId: err.correlationId
      });
  
      Office.context.ui.messageParent(JSON.stringify({
        error: true,
        errorCode: err.errorCode,
        errorMessage: err.errorMessage,
        subError: err.subError,
        correlationId: err.correlationId
      }));
    }
  }

  authenticate();
</script>
</body>
</html>
